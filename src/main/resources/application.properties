spring.application.name=spring-boot-jimmer

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Jimmer Configuration
jimmer.dialect=org.babyfish.jimmer.sql.dialect.PostgresDialect
jimmer.language=java
jimmer.show-sql=true
jimmer.pretty-sql=true

# Disable Spring Data JDBC autoconfiguration to avoid conflicts with Jimmer
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.jdbc.JdbcRepositoriesAutoConfiguration
